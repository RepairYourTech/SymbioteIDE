<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Symbiote</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <h1>Symbiote</h1>
      <p id="notice">
        The model turn in this demonstration is the operator's explicitly
        labeled fixture transport. A live one requires explicit
        authorization for credentials and billing — nothing is spent here.
      </p>
      <fieldset>
        <legend>Open a repository</legend>
        <label>State directory <input id="state-dir" value="/tmp/symbiote-desktop-demo/state" /></label>
        <label>Worktree base <input id="reservation-base" value="/tmp/symbiote-desktop-demo/worktrees" /></label>
        <label>Repository <input id="repository" value="/tmp/symbiote-desktop-demo/repo" /></label>
        <button id="begin">Begin session</button>
        <button id="stop">Stop</button>
      </fieldset>
      <fieldset>
        <legend>Demonstration</legend>
        <button id="start-demo">Describe task &amp; start dispatch</button>
        <button id="read-journal">Read evidence trail</button>
        <button id="finish-demo">Run &amp; read evidence</button>
        <button id="journal-position">Journal position</button>
      </fieldset>
      <pre id="log" aria-live="polite"></pre>
    </main>
    <script src="app.js"></script>
  </body>
</html>

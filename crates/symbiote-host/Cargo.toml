[package]
name = "symbiote-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
symbiote-workforce = { path = "../symbiote-workforce" }
symbiote-host-inventory = { path = "../symbiote-host-inventory" }
symbiote-domain = { path = "../symbiote-domain" }
symbiote-protocol = { path = "../symbiote-protocol" }
symbiote-store = { path = "../symbiote-store" }
symbiote-native-agent = { path = "../symbiote-native-agent" }
symbiote-repo = { path = "../symbiote-repo" }
symbiote-worktrees = { path = "../symbiote-worktrees" }
symbiote-trust = { path = "../symbiote-trust" }
symbiote-external-agent = { path = "../symbiote-external-agent" }
symbiote-sandbox = { path = "../symbiote-sandbox" }
symbiote-context = { path = "../symbiote-context" }
symbiote-runtime-transport = { path = "../symbiote-runtime-transport" }
symbiote-runtime-sdk = { path = "../symbiote-runtime-sdk" }
symbiote-runtime-discovery = { path = "../symbiote-runtime-discovery" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
nix = { version = "=0.30.1", features = ["socket", "user", "fs"] }

[dev-dependencies]
# The real-sandbox proofs resolve the launcher through the workflow crate's
# freshness check, which only test builds carry.
symbiote-workflow = { path = "../symbiote-workflow", features = ["test-support"] }

[lints]
workspace = true

[[bin]]
name = "symbioted"
path = "src/bin/symbioted.rs"

[[bin]]
name = "symbiote"
path = "src/bin/symbiote/main.rs"

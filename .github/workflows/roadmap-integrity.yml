name: Roadmap integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  closing-keywords:
    # GitHub honours a closing keyword wherever it appears in the description,
    # in the messages of the merged commits, or in the pull-request title —
    # which the repository's squash settings (squash_title=COMMIT_OR_PR_TITLE,
    # squash_message=COMMIT_MESSAGES) put at the head of the merged message
    # whenever the branch carries more than one commit. It reads no negation.
    # Every channel has closed an issue here by accident: #54 by the sentence
    # "This does not close #54." in PR #530, #54 again by the sentence "the
    # defect that closed #54 is reproduced rather than described" in the commit
    # message of PR #551, which read only descriptions. Fail the pull request
    # so the wording is fixed before the merge instead of after it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit messages below are read from the pull request's own
          # range, so its base and head must both be present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A pull-request description must state its closures and negate none
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: printf '%s' "$PR_BODY" | python3 planning/integrity/closing_keywords.py --base "$PR_BASE"
      - name: A pull-request title may not carry a closing keyword either
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: printf '%s' "$PR_TITLE" | python3 planning/integrity/closing_keywords.py --title --base "$PR_BASE"
      - name: A commit message may not carry a closing keyword at all
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in $(git log --format=%h "$PR_BASE_SHA..$PR_HEAD"); do
            git log -1 --format=%B "$sha" | python3 planning/integrity/closing_keywords.py \
              --commits --label "commit $sha" --base "$PR_BASE"
          done

  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The reader-size guard holds its own cap against the guard the tip this commit lands on
          # carried — the tip a push event names, the pull request's base on a merge ref — which can
          # sit several commits back when one push carries more than one, so this job needs the full
          # history the way the closing-keyword job above needs the pull request's own range.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical importers refuse execution
        run: python -m unittest discover -s planning -p 'test_legacy_importers.py' -v
      - name: Verify registry and closing-keyword invariants
        run: python -m unittest discover -s planning/integrity -p 'test_*.py' -v
      # The suite above declares the reader-size guard's cap; the driver below is what refuses a
      # guard grown past it, in both directions, in a copy of this checkout. A hold nothing runs is
      # not a hold, so the two run together over one full-history checkout — `test_python_floor.py`
      # holds those three links to this job.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Re-prove every refusal this repository claims
        run: python3 planning/integrity/revert_rules.py
      - name: Verify merged-checkout housekeeping
        run: python -m unittest discover -s planning/housekeeping -p 'test_*.py' -v
      # #171's registry, #172's parity matrices, #174's licensing and trust record, #175's release
      # record and #38's bake-off acceptance record are five more data-with-rules surfaces beside
      # this directory's: their own directories, their own readers, and suites that refuse a claim
      # with nothing behind it, a comparison with nothing holding it, a promise the tree cannot
      # back, a gate that omits the evidence it promises, and a criterion no obligation,
      # measurement or owner answers. This job owes every suite this repository's checks consist
      # of, so `test_python_floor.py` holds these five steps the way it holds the driver above and
      # the depth — through `chain.py` — and dropping any of them, moving it to another job,
      # putting it behind a condition that cannot hold or letting another command own its exit
      # status is refused there by name rather than leaving the suite unrun.
      - name: Verify the competitor registry and its snapshots
        run: python -m unittest discover -s planning/research -p 'test_*.py' -v
      - name: Verify the parity and gap matrices against that registry
        run: python -m unittest discover -s planning/parity -p 'test_*.py' -v
      - name: Verify the licensing, trust and data-ownership record
        run: python -m unittest discover -s planning/policy -p 'test_*.py' -v
      - name: Verify the release metrics, gates and non-goals
        run: python -m unittest discover -s planning/release -p 'test_*.py' -v
      - name: Verify the bake-off's acceptance criteria and what carries them
        run: python -m unittest discover -s planning/bakeoff -p 'test_*.py' -v

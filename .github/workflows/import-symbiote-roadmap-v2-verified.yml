name: Import and Verify Symbiote Roadmap v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - planning/bootstrap/import_symbiote_roadmap_v2.py
      - planning/bootstrap/run_symbiote_roadmap_v2_final.py
      - .github/workflows/import-symbiote-roadmap-v2-verified.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: symbiote-roadmap-v2-verified-import
  cancel-in-progress: false

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate importer syntax
        run: |
          python -m py_compile planning/bootstrap/import_symbiote_roadmap_v2.py
          python -m py_compile planning/bootstrap/run_symbiote_roadmap_v2_final.py

      - name: Import or update the complete roadmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python planning/bootstrap/run_symbiote_roadmap_v2_final.py

      - name: Verify the exact managed issue set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, re, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')
          source = Path('planning/bootstrap/import_symbiote_roadmap_v2.py').read_text(encoding='utf-8')
          expected = {'ROADMAP'}
          expected.update(re.findall(r'^epic\("([A-Z]\d{2})"', source, flags=re.M))
          expected.update(re.findall(r'^add\("([A-Z]\d{2})"', source, flags=re.M))
          expected.update(re.findall(r'^harness\("([A-Z]\d{2})"', source, flags=re.M))

          marker_re = re.compile(r'<!--\s*symbiote-plan-key:\s*([^\s]+)\s*-->')
          rows = []
          page = 1
          while True:
              url = f'{api}/repos/{repo}/issues?state=all&per_page=100&page={page}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'symbiote-roadmap-v2-verifier',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  batch = json.load(response)
              if not batch:
                  break
              rows.extend(x for x in batch if 'pull_request' not in x)
              if len(batch) < 100:
                  break
              page += 1

          managed = {}
          duplicates = {}
          for issue in rows:
              match = marker_re.search(issue.get('body') or '')
              if not match:
                  continue
              key = match.group(1)
              if key in managed:
                  duplicates.setdefault(key, [managed[key]['number']]).append(issue['number'])
              managed[key] = issue

          actual = set(managed)
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          closed = sorted((k, v['number']) for k, v in managed.items() if v.get('state') != 'open')
          if missing or unexpected or duplicates or closed:
              raise SystemExit(json.dumps({
                  'expected_count': len(expected),
                  'actual_count': len(actual),
                  'missing': missing,
                  'unexpected': unexpected,
                  'duplicates': duplicates,
                  'closed': closed,
              }, indent=2))

          status = {
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'repository': repo,
              'master_issue': managed['ROADMAP']['number'],
              'epic_count': sum(1 for key in expected if re.fullmatch(r'E\d{2}', key)),
              'atomic_issue_count': len(expected) - 1 - sum(1 for key in expected if re.fullmatch(r'E\d{2}', key)),
              'total_managed_issues': len(expected),
              'minimum_issue_number': min(v['number'] for v in managed.values()),
              'maximum_issue_number': max(v['number'] for v in managed.values()),
              'duplicate_markers': 0,
              'missing_markers': 0,
              'unexpected_markers': 0,
              'closed_managed_issues': 0,
          }
          Path('planning/bootstrap/ROADMAP_V2_IMPORT_STATUS.json').write_text(
              json.dumps(status, indent=2) + '\n', encoding='utf-8'
          )
          Path('planning/bootstrap/ROADMAP_V2_IMPORT_STATUS.md').write_text(
              '# Symbiote Roadmap v2 Import Status\n\n'
              f"- Verified: `{status['verified_at']}`\n"
              f"- Repository: `{repo}`\n"
              f"- Master issue: `#{status['master_issue']}`\n"
              f"- Epic trackers: **{status['epic_count']}**\n"
              f"- Atomic implementation issues: **{status['atomic_issue_count']}**\n"
              f"- Total managed issues: **{status['total_managed_issues']}**\n"
              '- Missing, duplicate, unexpected, or closed managed markers: **0**\n\n'
              'This file is generated only after the workflow imports the roadmap and independently verifies the exact stable-marker set through the GitHub Issues API.\n',
              encoding='utf-8'
          )
          print(json.dumps(status, indent=2))
          PY

      - name: Commit verified import status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planning/bootstrap/ROADMAP_V2_IMPORT_STATUS.json planning/bootstrap/ROADMAP_V2_IMPORT_STATUS.md
          if git diff --cached --quiet; then
            echo "Verification status unchanged"
          else
            git commit -m "chore: record verified Symbiote roadmap v2 import"
            git push
          fi

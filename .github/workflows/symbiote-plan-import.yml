name: Import Symbiote v2 issue program

on:
  workflow_dispatch:
  push:
    paths:
      - ".symbiote/issue-import/plan.json"

permissions:
  contents: read
  issues: read

concurrency:
  group: symbiote-v2-issue-import
  cancel-in-progress: false

jobs:
  import:
    # Historical payload is not authoritative. Replacement writer tracked in #470.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import and verify issue program
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .symbiote/issue-import/import_issues.py .symbiote/issue-import/plan.json

name: Rust contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-workbench:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/symbiote-desktop/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/symbiote-desktop/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fixture-transport notice is in the production bundle
        run: grep -F "explicitly labeled fixture transport" dist/assets/index.js
      - name: Committed dist matches the rebuild
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- crates/symbiote-desktop/app/dist
  contracts:
    # Noble's default runner rejects isolated loopback setup. Keep that failure
    # documented; do not disable AppArmor or relax the invocation to pass tests.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Linux sandbox runtime
        run: |
          sudo apt-get update
          # The desktop shell (Tauri 2) needs the WebKitGTK system stack
          # to compile; the sandbox runtime needs meson/ninja/libcap.
          sudo apt-get install --yes meson ninja-build libcap-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          git clone --no-checkout https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          git -C "$RUNNER_TEMP/bubblewrap" checkout --detach 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup "$RUNNER_TEMP/bubblewrap/build" "$RUNNER_TEMP/bubblewrap" -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bubblewrap/build" bwrap
          sudo install -m 0755 "$RUNNER_TEMP/bubblewrap/build/bwrap" /usr/bin/bwrap
          bwrap --version
          bwrap --unshare-all --unshare-user --disable-userns --assert-userns-disabled \
            --die-with-parent --new-session --clearenv --cap-drop ALL \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp \
            -- /usr/bin/true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Committed CLI schemas match what the binary emits
        if: matrix.toolchain == 'stable'
        run: |
          schemas=$(mktemp -d)
          cargo run --locked -p symbiote-host --bin symbiote -- schema --write "$schemas"
          diff -ru docs/contracts/schemas "$schemas"
      - name: Prove pinned Codex discovery without credentials or network
        if: matrix.toolchain == 'stable'
        run: |
          mkdir "$RUNNER_TEMP/codex-proof"
          cd "$RUNNER_TEMP/codex-proof"
          npm pack --ignore-scripts @openai/codex@0.118.0-linux-x64
          test "$(openssl dgst -sha512 -binary openai-codex-0.118.0-linux-x64.tgz | openssl base64 -A)" = 'vzU2d/gwAmZbf/DnwVzfQiNN3Ri04XpaZiJkHElIvGoqFbdrxRQFYTtslGDISYIO3o+POADZcFZIfamFsZj9yQ=='
          tar -xzf openai-codex-0.118.0-linux-x64.tgz
          sudo install -m 0755 package/vendor/x86_64-unknown-linux-musl/codex/codex /usr/bin/codex
          cd "$GITHUB_WORKSPACE"
          cargo build --locked -p symbiote-sandbox --bin symbiote-sandbox-launch
          proof_root=$(mktemp -d "$RUNNER_TEMP/discovery.XXXXXXXX")
          mkdir -m 700 "$proof_root/worktree" "$proof_root/protected"
          cargo run --locked -p symbiote-runtime-discovery --example codex_discover -- \
            "$GITHUB_WORKSPACE/target/debug/symbiote-sandbox-launch" \
            "$proof_root/worktree" "$proof_root/protected"
      - name: Prove pinned Codex driver handshake and thread start without a model turn
        if: matrix.toolchain == 'stable'
        run: |
          cargo build --locked -p symbiote-external-agent --example codex_thread_smoke
          smoke_root=$(mktemp -d "$RUNNER_TEMP/smoke.XXXXXXXX")
          mkdir -m 700 "$smoke_root/worktree" "$smoke_root/protected"
          cargo run --locked -p symbiote-external-agent --example codex_thread_smoke -- \
            "$GITHUB_WORKSPACE/target/debug/symbiote-sandbox-launch" \
            "$smoke_root/worktree" "$smoke_root/protected"

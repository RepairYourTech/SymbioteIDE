name: Clean Obsolete Symbiote Roadmap Bootstrap Files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-symbiote-roadmap-bootstrap.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove superseded runner and workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            planning/bootstrap/run_symbiote_roadmap_v2.py \
            .github/workflows/import-symbiote-roadmap-v2.yml \
            .github/workflows/import-symbiote-roadmap-v2-final.yml \
            .github/workflows/cleanup-obsolete-symbiote-roadmap-bootstrap.yml
          git commit -m "chore: remove superseded Symbiote roadmap import workflows"
          git push

name: Nightly Build

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  nightly-build:
    name: Nightly Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            platform: linux
          - os: windows-latest
            name: Windows
            platform: win32
          - os: macos-latest
            name: macOS
            platform: darwin
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Get date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --passWithNoTests
      continue-on-error: true
    
    - name: Build application
      run: |
        npm run compile || true
        npm run compile-build || true
    
    - name: Package nightly
      env:
        SYMBIOTE_BUILD_VERSION: nightly-${{ steps.date.outputs.date }}
      run: |
        npx electron-builder --${{ matrix.platform }} --publish never
    
    - name: Upload nightly artifacts
      uses: actions/upload-artifact@v4
      with:
        name: symbiote-ide-nightly-${{ matrix.platform }}-${{ steps.date.outputs.date }}
        path: |
          dist/*.exe
          dist/*.dmg
          dist/*.AppImage
          dist/*.deb
        retention-days: 7

  cleanup-old-nightlies:
    name: Cleanup Old Nightlies
    runs-on: ubuntu-latest
    needs: nightly-build
    
    steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { owner, repo } = context.repo;
          const artifactsToKeep = 7;
          
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner,
            repo,
            per_page: 100
          });
          
          const nightlyArtifacts = artifacts.data.artifacts
            .filter(a => a.name.includes('nightly'))
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          
          for (let i = artifactsToKeep; i < nightlyArtifacts.length; i++) {
            await github.rest.actions.deleteArtifact({
              owner,
              repo,
              artifact_id: nightlyArtifacts[i].id
            });
            console.log(`Deleted old nightly: ${nightlyArtifacts[i].name}`);
          }
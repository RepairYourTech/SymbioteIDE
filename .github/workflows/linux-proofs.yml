name: Bounded Linux proofs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-lifetime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo test --locked --manifest-path spikes/host-lifecycle/Cargo.toml
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path spikes/host-lifecycle/Cargo.toml --check
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --manifest-path spikes/host-lifecycle/Cargo.toml --all-targets -- -D warnings
  shell-client-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    defaults:
      run:
        working-directory: spikes/linux-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: The fixture's Tauri crate needs the WebKitGTK system stack to compile
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 -m py_compile run-proof.py
      - run: python3 -m unittest test_run_proof -v
      # `spikes/linux-shell/src-tauri` is its own workspace, so no `--workspace` job
      # compiles it and a change that broke its build, test, formatting or lints passed
      # every check. The frontend build above is what its `tauri-build` embeds.
      #
      # The crate declares `rust-version = "1.85.0"` and builds there, so this job runs
      # the matrix `host-lifetime` runs: the fixture's Rust is the same Rust on the
      # pinned toolchain as on stable. Its lockfile holds the newest dependency versions
      # that declare support for that floor; a `cargo update` past them fails the 1.85.0
      # run by name. Formatting and lints run where CI reads them, on stable.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

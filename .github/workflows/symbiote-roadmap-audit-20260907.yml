name: Symbiote roadmap audit 2026-09-07
on:
  push:
    branches: ['planning/audit-2026-09-07']
    paths: ['.symbiote-planning/audit-2026-09-07/**', '.github/workflows/symbiote-roadmap-audit-20260907.yml']
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: symbiote-roadmap-audit-20260907
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply authorized issue-only reconciliation and verify live state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .symbiote-planning/audit-2026-09-07/apply_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-audit-result
          path: audit-output/
          retention-days: 30

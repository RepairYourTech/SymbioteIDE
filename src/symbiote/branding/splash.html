<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SymbioteIDE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f1e;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .logo-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
        }

        .logo {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #00D4FF, #7B61FF, #FF006E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        .logo::before {
            content: 'S';
            font-size: 100px;
            font-weight: bold;
            color: #0f0f1e;
            position: absolute;
        }

        .neural-network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }

        .neural-line {
            stroke: url(#gradient);
            stroke-width: 2;
            fill: none;
            animation: flow 3s linear infinite;
        }

        .neural-node {
            fill: url(#gradient);
            animation: blink 2s ease-in-out infinite;
        }

        .title {
            font-size: 36px;
            font-weight: 300;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 16px;
            color: #7B61FF;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: #1a1a2e;
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #00D4FF, #7B61FF, #FF006E);
            border-radius: 2px;
            animation: loading 2s ease-in-out infinite;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #5a5a7e;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(123, 97, 255, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(123, 97, 255, 0); }
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes flow {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 100; }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <svg class="neural-network" viewBox="0 0 200 200">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#FF006E;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path class="neural-line" d="M 40 60 L 100 100 L 60 140" stroke-dasharray="5,5"/>
                <path class="neural-line" d="M 160 60 L 100 100 L 140 140" stroke-dasharray="5,5"/>
                <circle class="neural-node" cx="40" cy="60" r="4"/>
                <circle class="neural-node" cx="160" cy="60" r="4"/>
                <circle class="neural-node" cx="100" cy="100" r="6"/>
                <circle class="neural-node" cx="60" cy="140" r="4"/>
                <circle class="neural-node" cx="140" cy="140" r="4"/>
            </svg>
            <div class="logo"></div>
        </div>
        <h1 class="title">SymbioteIDE</h1>
        <p class="subtitle">AI-Powered Development Environment</p>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <p class="status">Initializing AI systems...</p>
    </div>
    <script>
        const statusMessages = [
            'Initializing AI systems...',
            'Loading language models...',
            'Connecting to MCP servers...',
            'Preparing workspace...',
            'Almost ready...'
        ];
        
        let messageIndex = 0;
        const statusElement = document.querySelector('.status');
        
        setInterval(() => {
            messageIndex = (messageIndex + 1) % statusMessages.length;
            statusElement.textContent = statusMessages[messageIndex];
        }, 2000);
    </script>
</body>
</html>

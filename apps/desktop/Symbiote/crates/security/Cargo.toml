[package]
name = "symbiote-security"
version = "0.1.0"
edition = "2021"
description = "Comprehensive security and permissions system for Symbiote"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["security", "permissions", "audit", "sandbox", "compliance"]
categories = ["authentication", "cryptography", "os"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-vault = { path = "../vault" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
secrecy = "0.8"

# Database for audit logs
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }

# Pattern matching and validation
regex = "1.0"

# Performance
dashmap = "5.0"
parking_lot = "0.12"

# Configuration
config = "0.13"
toml = "0.8"

# Observability
opentelemetry = "0.20"
prometheus = "0.13"

# Platform-specific sandboxing
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "signal", "mount"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_System_JobObjects", "Win32_Security"] }

# WASM sandboxing (optional)
wasmtime = { version = "14.0", optional = true }
wasmtime-wasi = { version = "14.0", optional = true }

# Machine learning for threat detection (optional)
candle-core = { version = "0.3", optional = true }
candle-nn = { version = "0.3", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"

[features]
default = ["wasm-sandbox", "ml-threat-detection"]
wasm-sandbox = ["wasmtime", "wasmtime-wasi"]
ml-threat-detection = ["candle-core", "candle-nn"]

[[bin]]
name = "security-manager"
path = "src/main.rs"

[[bench]]
name = "permission_evaluation"
harness = false

[[bench]]
name = "audit_logging"
harness = false

[[bench]]
name = "sandboxing_performance"
harness = false

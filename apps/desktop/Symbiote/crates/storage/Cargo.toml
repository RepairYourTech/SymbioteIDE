[package]
name = "symbiote-storage"
version = "0.1.0"
edition = "2021"
description = "High-level, type-safe SQLite abstraction layer for Symbiote"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["storage", "database", "sqlite", "orm", "persistence"]
categories = ["database", "development-tools"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Performance
dashmap = "5.0"
parking_lot = "0.12"

# Configuration
config = "0.13"
toml = "0.8"

# Caching (optional)
moka = { version = "0.12", features = ["future"], optional = true }
redis = { version = "0.24", optional = true }

# Compression for backups
flate2 = "1.0"
tar = "0.4"

# Observability
opentelemetry = "0.20"
prometheus = "0.13"

# Migration embedding
include_dir = "0.7"

# Encryption for data at rest (optional)
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"
proptest = "1.0"

[features]
default = ["caching", "encryption"]
caching = ["moka", "redis"]
encryption = ["chacha20poly1305", "argon2"]

[[bin]]
name = "storage-manager"
path = "src/main.rs"

[[bench]]
name = "query_performance"
harness = false

[[bench]]
name = "connection_pooling"
harness = false

[[bench]]
name = "transaction_throughput"
harness = false

[package]
name = "symbiote-vault"
version = "0.1.0"
edition = "2021"
description = "Secure credential management and secrets vault for Symbiote"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["vault", "secrets", "keychain", "encryption", "security"]
categories = ["cryptography", "authentication", "os"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-security = { path = "../security" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Cryptography
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
rand = "0.8"
secrecy = "0.8"
zeroize = "1.6"

# Cross-platform keychain
keyring = "2.0"

# Platform-specific keychain integration
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.9"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "3.0"

# Hardware wallet support (optional)
ledger-transport = { version = "0.10", optional = true }
trezor-client = { version = "0.8", optional = true }

# Hardware security modules (optional)
tpm-rs = { version = "0.1", optional = true }
pkcs11 = { version = "0.8", optional = true }

# MFA support
totp-rs = "5.0"
webauthn-rs = { version = "0.4", optional = true }

# Database for audit logs
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }

# HTTP client for egress proxy
reqwest = { version = "0.11", features = ["json"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Performance
dashmap = "5.0"
parking_lot = "0.12"

# Configuration
config = "0.13"
toml = "0.8"

# Observability
opentelemetry = "0.20"
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"

[features]
default = ["hardware-wallets", "mfa", "hsm"]
hardware-wallets = ["ledger-transport", "trezor-client"]
mfa = ["webauthn-rs"]
hsm = ["tpm-rs", "pkcs11"]

[[bin]]
name = "vault-daemon"
path = "src/main.rs"

[[bench]]
name = "encryption_performance"
harness = false

[[bench]]
name = "keychain_operations"
harness = false

[[bench]]
name = "secret_handle_performance"
harness = false

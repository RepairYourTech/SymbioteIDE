[package]
name = "symbiote-context"
version = "0.1.0"
edition = "2021"
description = "Hybrid context engine with SQLite + Qdrant + Neo4j for Symbiote"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["context", "search", "embeddings", "graph", "hybrid"]
categories = ["database", "algorithms", "text-processing"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-ai = { path = "../ai" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database - SQLite (always available)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }

# Vector database - Qdrant (optional)
qdrant-client = { version = "1.7", optional = true }

# Graph database - Neo4j (optional)
neo4rs = { version = "0.7", optional = true }

# Embeddings and ML
candle-core = { version = "0.3", optional = true }
candle-nn = { version = "0.3", optional = true }
tiktoken-rs = "0.5"

# File watching and monitoring
notify = "6.0"
walkdir = "2.0"

# Text processing
regex = "1.0"
unicode-segmentation = "1.0"

# Caching
moka = { version = "0.12", features = ["future"] }

# Performance
dashmap = "5.0"
parking_lot = "0.12"
rayon = "1.0"

# Git integration
git2 = "0.18"

# LSP integration
tower-lsp = { version = "0.20", optional = true }
lsp-types = { version = "0.94", optional = true }

# AST parsing
tree-sitter = { version = "0.20", optional = true }

# Configuration
config = "0.13"
toml = "0.8"

# Path utilities
path-absolutize = "3.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"

[features]
default = ["vector", "graph", "lsp", "ast"]
vector = ["qdrant-client", "candle-core", "candle-nn"]
graph = ["neo4rs"]
lsp = ["tower-lsp", "lsp-types"]
ast = ["tree-sitter"]

[[bin]]
name = "context-engine"
path = "src/main.rs"

[[bench]]
name = "search_performance"
harness = false

[[bench]]
name = "indexing_performance"
harness = false

[[bench]]
name = "hybrid_retrieval"
harness = false

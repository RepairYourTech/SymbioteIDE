[package]
name = "symbiote-assistant"
version = "0.1.0"
edition = "2021"
description = "Personal AI Assistant that serves as the central intelligence and unified interface for Symbiote"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["assistant", "ai", "orchestrator", "chat", "multimodal"]
categories = ["development-tools", "gui"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-ai = { path = "../ai" }
symbiote-agents = { path = "../agents" }
symbiote-context = { path = "../context" }
symbiote-memory = { path = "../memory" }
symbiote-tools = { path = "../tools" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client and server
reqwest = { version = "0.11", features = ["json", "stream"] }
axum = { version = "0.7", features = ["ws", "headers"] }

# WebSocket for real-time communication
tokio-tungstenite = "0.21"

# Voice processing
whisper-rs = { version = "0.1", optional = true }

# Image processing
candle-core = { version = "0.3", optional = true }
candle-nn = { version = "0.3", optional = true }

# Database for conversation history
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Configuration
config = "0.13"
toml = "0.8"

# Performance
dashmap = "5.0"
parking_lot = "0.12"

# UI Framework (for chat interface)
leptos = { version = "0.6", features = ["csr"] }

# Desktop automation (optional)
enigo = { version = "0.1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"

[features]
default = ["voice", "vision", "desktop"]
voice = ["whisper-rs"]
vision = ["candle-core", "candle-nn"]
desktop = ["enigo"]

[[bin]]
name = "assistant"
path = "src/main.rs"

[[bench]]
name = "orchestration_performance"
harness = false

[[bench]]
name = "response_generation"
harness = false

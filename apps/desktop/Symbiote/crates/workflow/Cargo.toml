[package]
name = "symbiote-workflow"
version = "0.1.0"
edition = "2021"
description = "Visual workflow builder and automation engine with AI-powered nodes"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["workflow", "automation", "visual", "ai", "agents"]
categories = ["development-tools", "automation"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-ai = { path = "../ai" }
symbiote-agents = { path = "../agents" }
symbiote-tools = { path = "../tools" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Redis for state management
redis = { version = "0.24", features = ["tokio-comp"] }

# HTTP client for connectors
reqwest = { version = "0.11", features = ["json"] }

# JSON schema validation
jsonschema = "0.17"

# Scheduling
cron = "0.12"

# File watching
notify = "6.0"

# Regular expressions
regex = "1.0"

# Template engine
handlebars = "4.0"

# Observability
opentelemetry = "0.20"

# Performance
dashmap = "5.0"
parking_lot = "0.12"

# UI Framework (for visual builder)
leptos = { version = "0.6", features = ["csr"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"

[[bin]]
name = "workflow"
path = "src/main.rs"

[[bench]]
name = "workflow_execution"
harness = false

[[bench]]
name = "node_performance"
harness = false

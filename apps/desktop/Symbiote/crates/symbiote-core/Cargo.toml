[package]
name = "symbiote-core"
version = "0.1.0"
edition = "2021"
description = "Foundation crate for the Symbiote ecosystem providing core types, error handling, and dependency injection"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["symbiote", "core", "foundation", "async", "dependency-injection"]
categories = ["development-tools", "asynchronous"]

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Concurrency
once_cell = "1.0"
parking_lot = "0.12"

# Configuration
config = "0.13"
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"

[[bench]]
name = "service_resolution"
harness = false

[[bench]]
name = "error_creation"
harness = false

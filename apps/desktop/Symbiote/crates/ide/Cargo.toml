[package]
name = "symbiote-ide"
version = "0.1.0"
edition = "2021"
description = "AI-native IDE with advanced code editing, debugging, and collaboration capabilities"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["ide", "editor", "ai", "development", "collaboration"]
categories = ["development-tools", "text-editors"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-ai = { path = "../ai" }
symbiote-context = { path = "../context" }
symbiote-tools = { path = "../tools" }

# UI Framework
tauri = { version = "2.0", features = ["api-all"] }
leptos = { version = "0.6", features = ["csr"] }

# Language support
tree-sitter = "0.20"
tree-sitter-highlight = "0.20"
lsp-types = "0.94"
lsp-server = "0.7"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# File system
notify = "6.0"
walkdir = "2.0"
ignore = "0.4"

# Git integration
git2 = "0.18"

# Text editing
ropey = "1.6"
regex = "1.0"

# Plugin system
wasmtime = "14.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# HTTP server
axum = { version = "0.7", features = ["ws", "headers"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket
tokio-tungstenite = "0.21"

# Configuration
config = "0.13"
toml = "0.8"

# Performance
dashmap = "5.0"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"

[[bin]]
name = "ide"
path = "src/main.rs"

[[bench]]
name = "editor_performance"
harness = false

[[bench]]
name = "ai_completion"
harness = false

[package]
name = "symbiote-memory"
version = "0.1.0"
edition = "2021"
description = "Intelligent memory system with working, episodic, semantic, and procedural memory for Symbiote"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["memory", "learning", "cognitive", "episodic", "semantic"]
categories = ["algorithms", "data-structures", "science"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-context = { path = "../context" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database for memory metadata
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }

# Graph processing for semantic relationships
petgraph = "0.6"

# Pattern matching and text processing
regex = "1.0"
unicode-segmentation = "1.0"

# Caching and performance
moka = { version = "0.12", features = ["future"] }
dashmap = "5.0"
parking_lot = "0.12"

# Machine learning and clustering
linfa = { version = "0.7", optional = true }
linfa-clustering = { version = "0.7", optional = true }

# Embeddings for semantic similarity
candle-core = { version = "0.3", optional = true }
candle-nn = { version = "0.3", optional = true }

# Configuration
config = "0.13"
toml = "0.8"

# Observability
opentelemetry = "0.20"
prometheus = "0.13"

# Compression for memory optimization
flate2 = "1.0"

# Random number generation for forgetting algorithms
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"

[features]
default = ["ml", "embeddings"]
ml = ["linfa", "linfa-clustering"]
embeddings = ["candle-core", "candle-nn"]

[[bin]]
name = "memory-manager"
path = "src/main.rs"

[[bench]]
name = "memory_retrieval"
harness = false

[[bench]]
name = "consolidation_performance"
harness = false

[[bench]]
name = "forgetting_algorithms"
harness = false

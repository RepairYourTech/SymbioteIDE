[package]
name = "symbiote-agents"
version = "0.1.0"
edition = "2021"
description = "Core agent framework and runtime for Symbiote multi-agent systems"
license = "MIT"
repository = "https://github.com/RepairYourTech/SymbioteIDE"
keywords = ["agents", "multi-agent", "coordination", "runtime", "framework"]
categories = ["development-tools", "concurrency"]

[dependencies]
# Core dependencies
symbiote-core = { path = "../symbiote-core" }
symbiote-agents-sdk = { path = "../agents-sdk" }
symbiote-security = { path = "../security" }
symbiote-monitoring = { path = "../monitoring" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Consensus and coordination
raft = "0.7"
etcd-client = "0.12"

# Service discovery
consul = "0.4"

# Load balancing
tower = "0.4"
tower-load = "0.3"

# Circuit breakers and fault tolerance
circuit-breaker = "0.1"

# Performance
dashmap = "5.0"
parking_lot = "0.12"
crossbeam = "0.8"

# Metrics and observability
opentelemetry = "0.20"
prometheus = "0.13"

# Configuration
config = "0.13"
toml = "0.8"

# Database for agent state
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Message passing
crossbeam-channel = "0.5"

# Work stealing
rayon = "1.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
mockall = "0.12"
chaos-engineering = "0.1"

[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[[bench]]
name = "agent_coordination"
harness = false

[[bench]]
name = "message_routing"
harness = false

[[bench]]
name = "scaling_performance"
harness = false

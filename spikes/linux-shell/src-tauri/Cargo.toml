[package]
name = "symbiote-linux-shell-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = "=2.6.3"
png = "0.18"

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
gtk = "=0.18.2"

[lints.rust]
unsafe_code = "forbid"

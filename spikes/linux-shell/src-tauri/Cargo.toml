[package]
name = "symbiote-linux-shell-proof"
version = "0.0.0"
edition = "2024"
publish = false
# The floor this fixture is built and tested on, which CI holds in a matrix the
# way it holds the host-lifetime spike's. It is declared rather than assumed:
# without it cargo's resolver picks the newest dependencies and clippy suggests
# `let` chains, both of which are newer than the toolchain the workspace pins.
rust-version = "1.85.0"

[workspace]

[build-dependencies]
tauri-build = "=2.6.3"
png = "0.18"

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
gtk = "=0.18.2"

[lints.rust]
unsafe_code = "forbid"
